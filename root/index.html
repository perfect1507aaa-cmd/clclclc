<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>root</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
  --bg0:#eef1ef; --bg1:#dde4df; --fg:#0d1311; --fg2:rgba(13,19,17,.58); --fg3:rgba(13,19,17,.32);
  --line:rgba(13,19,17,.14); --glass:rgba(242,246,243,.78); --glass-border:rgba(13,19,17,.12);
  --fill:rgba(13,19,17,.045); --fill2:rgba(13,19,17,.085); --grid:rgba(13,19,17,.07); --rain:#0C9A6A;
  --shadow:0 24px 60px rgba(10,30,20,.12);
  --c0:#8a939c; --c1:#0C9A6A; --c2:#D0266E; --c3:#B08A06; --c4:#D9561C; --on-accent:#ffffff;
  --sel:rgba(13,19,17,.7); --dark:0; --scan:0;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg0:#020403; --bg1:#07110d; --fg:#d6eee2; --fg2:rgba(214,238,226,.55); --fg3:rgba(214,238,226,.28);
    --line:rgba(120,255,190,.14); --glass:rgba(4,10,8,.74); --glass-border:rgba(120,255,190,.14);
    --fill:rgba(120,255,190,.035); --fill2:rgba(120,255,190,.075); --grid:rgba(120,255,190,.045); --rain:#3DFFA2;
    --shadow:0 30px 90px rgba(0,0,0,.6);
    --c0:#56616a; --c1:#3DFFA2; --c2:#FF3D7F; --c3:#FFD23D; --c4:#FF7A33; --on-accent:#02140c;
    --sel:rgba(214,238,226,.75); --dark:1; --scan:1;
  }
}
:root[data-theme="dark"]{
  --bg0:#020403; --bg1:#07110d; --fg:#d6eee2; --fg2:rgba(214,238,226,.55); --fg3:rgba(214,238,226,.28);
  --line:rgba(120,255,190,.14); --glass:rgba(4,10,8,.74); --glass-border:rgba(120,255,190,.14);
  --fill:rgba(120,255,190,.035); --fill2:rgba(120,255,190,.075); --grid:rgba(120,255,190,.045); --rain:#3DFFA2;
  --shadow:0 30px 90px rgba(0,0,0,.6);
  --c0:#56616a; --c1:#3DFFA2; --c2:#FF3D7F; --c3:#FFD23D; --c4:#FF7A33; --on-accent:#02140c;
  --sel:rgba(214,238,226,.75); --dark:1; --scan:1;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  background:var(--bg0); color:var(--fg); font-family:var(--mono); font-size:13px;
  -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#cv{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#scan{
  position:fixed; inset:0; pointer-events:none; opacity:calc(var(--scan) * .025);
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.9) 0 1px, transparent 1px 3px);
}
button{ font-family:inherit; color:inherit; }
button:focus-visible{ outline:1px solid var(--c1); outline-offset:3px; }

.panel{
  background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(140%); backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--glass-border); box-shadow:var(--shadow);
}

/* HUD */
#hud{ position:fixed; inset:0; pointer-events:none; transition:opacity .5s ease; }
#hud.hidden{ opacity:0; }
#hud.hidden *{ pointer-events:none !important; }
.hud-top{
  position:absolute; top:0; left:0; right:0; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;
}
.icon-btn{
  pointer-events:auto; min-width:40px; height:36px; border-radius:8px; display:grid; place-items:center; cursor:pointer;
  font-size:12px; letter-spacing:.02em; padding:0 10px; transition:border-color .2s ease, color .2s ease;
}
.icon-btn:hover{ border-color:var(--c1); color:var(--c1); }
.hud-center{
  pointer-events:none; border-radius:8px; padding:8px 14px 9px; min-width:230px; max-width:56vw;
  display:flex; flex-direction:column; gap:7px;
}
.hud-row{ display:flex; justify-content:space-between; align-items:baseline; gap:14px; }
.hud-title{ font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hud-count{ font-size:11px; color:var(--fg2); white-space:nowrap; }
.popbar{ width:100%; height:3px; display:flex; overflow:hidden; gap:2px; }
.popbar i{ display:block; height:100%; transition:flex-grow .8s cubic-bezier(.3,.7,.2,1); flex-basis:0; border-radius:1px; }
.popnums{ display:flex; justify-content:space-between; gap:12px; font-size:11px; font-variant-numeric:tabular-nums; margin-top:-2px; }
.popnums span{ white-space:nowrap; }
.popnums span:first-child{ font-size:13px; font-weight:700; }
.hud-bottom{
  position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center;
  padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);
}
.pill{ pointer-events:auto; border-radius:10px; padding:5px; display:flex; align-items:center; gap:12px; }
.pill-label{ font-size:11px; color:var(--fg2); white-space:nowrap; padding-right:9px; }
.pill-label.half{ color:var(--c1); }
.grp{
  height:28px; border:1px solid var(--line); border-radius:6px; background:transparent; font-size:12px; padding:0 10px;
  cursor:pointer; white-space:nowrap; transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.grp:hover{ border-color:var(--c1); color:var(--c1); }
.grp[aria-pressed="true"]{ border-color:var(--c1); color:var(--c1); background:var(--fill2); }
.grp .k{ color:var(--fg3); margin-left:6px; font-size:11px; }
.info{ pointer-events:none; border-radius:10px; padding:8px 14px 9px; min-width:min(460px, calc(100vw - 28px)); max-width:calc(100vw - 28px); display:flex; flex-direction:column; gap:3px; }
.info-a{ font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.info-b{ font-size:11px; color:var(--fg2); display:flex; flex-wrap:wrap; column-gap:16px; row-gap:2px; }
.info-b b{ font-weight:500; color:var(--fg); }
.info-b .bad{ color:var(--c2); }
#mini{ position:absolute; right:16px; top:calc(env(safe-area-inset-top,0px) + 60px); width:176px; height:112px; border-radius:8px; pointer-events:auto; cursor:crosshair; touch-action:none; }
@media (max-width:600px){ #mini{ width:120px; height:80px; right:12px; } }
.pop{ position:absolute; min-width:230px; max-width:min(320px, calc(100vw - 24px)); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:5px; pointer-events:auto; z-index:5; }
.pop[hidden]{ display:none; }
.legend{ position:absolute; left:16px; top:calc(env(safe-area-inset-top,0px) + 64px); width:min(300px, calc(100vw - 32px)); max-height:calc(100% - 150px); border-radius:8px; pointer-events:auto; display:flex; flex-direction:column; overflow:hidden; z-index:4; }
.legend[hidden]{ display:none; }
.legend-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border:0; background:transparent; font-size:11px; color:var(--fg2); cursor:pointer; text-align:left; }
.legend-head:hover{ color:var(--c1); }
.legend-list{ overflow-y:auto; padding:0 8px 8px; display:flex; flex-direction:column; gap:2px; }
.legend-list[hidden]{ display:none; }
.legend-item{ display:grid; grid-template-columns:38px 1fr; gap:8px; align-items:center; padding:4px 2px; border-top:1px solid var(--line); }
.legend-item canvas{ width:38px; height:38px; }
.legend-item b{ display:block; font-size:12px; font-weight:500; }
.legend-item span{ display:block; font-size:10.5px; line-height:1.4; color:var(--fg2); }
.pop .pt{ font-size:11px; color:var(--fg2); padding:2px 4px 4px; line-height:1.4; }
.pop button{ text-align:left; min-height:32px; border:1px solid var(--line); border-radius:5px; background:transparent; font-size:12px; padding:6px 10px; cursor:pointer; line-height:1.35; }
.pop button:hover{ border-color:var(--c1); color:var(--c1); }
.pop button[disabled]{ opacity:.45; cursor:default; border-color:var(--line); color:var(--fg2); }

.seg{
  --n:4; --i:0; position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  border:1px solid var(--line); border-radius:6px; padding:2px; min-width:180px;
}
.seg::before{
  content:""; position:absolute; top:2px; bottom:2px; left:2px; width:calc((100% - 4px) / var(--n));
  background:var(--c1); border-radius:4px;
  transform:translateX(calc(100% * var(--i))); transition:transform .25s cubic-bezier(.3,.7,.2,1);
}
.seg button{
  position:relative; z-index:1; border:0; background:transparent; height:26px; padding:0 10px; cursor:pointer;
  font-size:12px; border-radius:4px; white-space:nowrap; color:var(--fg2); transition:color .2s ease;
}
.seg button[aria-pressed="true"]{ color:var(--on-accent); font-weight:500; }

.toast{
  position:absolute; left:50%; top:calc(env(safe-area-inset-top,0px) + 82px); transform:translate(-50%,-6px);
  border-radius:8px; padding:9px 14px; font-size:12px; line-height:1.5; max-width:min(440px, calc(100vw - 32px));
  opacity:0; transition:opacity .4s ease, transform .4s ease; pointer-events:none;
}
.toast::before{ content:"> "; color:var(--c1); }
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* Screens */
.screen{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center; overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);
  opacity:0; pointer-events:none; transition:opacity .45s ease;
}
.screen.show{ opacity:1; pointer-events:auto; }
.card{ border-radius:12px; width:min(380px, 100%); margin:auto; overflow:hidden; }
.card.wide{ width:min(580px, 100%); }
.titlebar{
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px;
  border-bottom:1px solid var(--line); font-size:11px; color:var(--fg2);
}
.titlebar .path{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.titlebar .led{ width:6px; height:6px; border-radius:50%; background:var(--c1); box-shadow:0 0 8px var(--c1); flex:none; animation:blink 2.4s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:.25; } }
.body{ padding:26px 24px 22px; }
.wordmark{ margin:0 0 6px; font-size:40px; line-height:1; font-weight:300; letter-spacing:-.02em; }
.wordmark .caret{ display:inline-block; width:.5em; height:.9em; background:var(--c1); margin-left:4px; vertical-align:-.08em; animation:blink 1.05s steps(1) infinite; }
.tagline{ margin:0 0 28px; color:var(--fg2); font-size:12px; }
.stack{ display:flex; flex-direction:column; gap:6px; }
.btn{
  height:42px; border-radius:6px; border:1px solid var(--line); cursor:pointer; font-size:13px;
  background:transparent; color:var(--fg); text-align:left; padding:0 14px; display:flex; align-items:center; justify-content:space-between;
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.btn::before{ content:">"; color:var(--fg3); margin-right:10px; transition:color .15s ease; }
.btn .lbl{ flex:1; }
.btn:hover{ border-color:var(--c1); color:var(--c1); background:var(--fill); }
.btn:hover::before{ color:var(--c1); }
.btn.primary{ border-color:var(--c1); color:var(--c1); }
.btn.primary::before{ color:var(--c1); }
.btn .hint{ font-size:11px; color:var(--fg3); }
.settings{ margin-top:22px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px; }
.toggle{
  border:0; background:transparent; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  padding:6px 0; font-size:12px; color:var(--fg2);
}
.toggle:hover{ color:var(--fg); }
.toggle .state{ color:var(--fg3); }
.toggle[aria-pressed="true"] .state{ color:var(--c1); }

.back{
  border:0; background:transparent; color:var(--fg2); font-size:11px; cursor:pointer; padding:0;
}
.back:hover{ color:var(--c1); }

.grid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
@media (max-width:520px){ .grid{ grid-template-columns:repeat(3, 1fr); } }
.tile{
  position:relative; aspect-ratio:1; border-radius:6px; border:1px solid var(--line); background:transparent; cursor:pointer;
  display:flex; flex-direction:column; justify-content:space-between; padding:10px; text-align:left;
  transition:border-color .15s ease, background .15s ease;
}
.tile:hover{ border-color:var(--c1); background:var(--fill); }
.tile b{ font-size:20px; font-weight:300; line-height:1; }
.tile small{ font-size:10px; color:var(--fg2); line-height:1.3; }
.tile .dots{ position:absolute; top:12px; right:10px; display:flex; gap:3px; }
.tile .dots i{ width:4px; height:4px; }
.tile[disabled]{ cursor:default; }
.tile[disabled] b, .tile[disabled] small{ color:var(--fg3); }
.tile[disabled]:hover{ border-color:var(--line); background:transparent; }
.tile .done{ position:absolute; right:10px; bottom:9px; font-size:10px; color:var(--c1); }

.form-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
.form-row label{ font-size:11px; color:var(--fg2); }
.form-row .seg{ min-width:0; }

.howto{ display:flex; flex-direction:column; gap:18px; margin:0 0 24px; }
.howto div{ display:flex; gap:16px; align-items:flex-start; font-size:12px; line-height:1.6; }
.howto svg{ flex:none; width:30px; height:30px; margin-top:2px; color:var(--c1); }
.howto p{ margin:0; }
.howto .muted{ color:var(--fg2); }

.end-title{ margin:0; font-size:24px; font-weight:400; letter-spacing:.02em; }
.end-title.win{ color:var(--c1); }
.end-title.lose{ color:var(--c2); }
.end-sub{ margin:8px 0 22px; color:var(--fg2); font-size:12px; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); margin-bottom:22px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.stats div{ padding:12px 0; }
.stats div + div{ border-left:1px solid var(--line); padding-left:12px; }
.stats b{ display:block; font-size:18px; font-weight:400; }
.stats span{ font-size:10px; color:var(--fg2); }

@media (prefers-reduced-motion: reduce){
  .screen, .toast, .seg::before{ transition:none; }
  .caret, .titlebar .led{ animation:none; }
}
</style>
<canvas id="cv" aria-label="Карта сети"></canvas>
<div id="scan"></div>
<div id="safeProbe" style="position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <button class="icon-btn panel" id="btnPause" aria-label="Пауза">||</button>
    <div class="hud-center panel">
      <div class="hud-row"><div class="hud-title" id="hudTitle"></div><div class="hud-count" id="hudCount"></div></div>
      <div class="popbar" id="popbar"></div>
      <div class="popnums" id="popnums"></div>
    </div>
    <button class="icon-btn panel" id="btnSpeed" aria-label="Скорость игры">x1</button>
  </div>
  <div class="hud-bottom">
    <div class="pill panel">
      <button class="grp" id="btnAll" aria-pressed="false"></button>
      <button class="grp" id="btnFog" aria-pressed="true" hidden></button>
      <span class="pill-label" id="pctLabel">пачка 100% · shift — 50%</span>
    </div>
  </div>
  <canvas id="mini" class="panel" aria-label="Мини-карта"></canvas>
  <div id="toast" class="toast panel" role="status" aria-live="polite"></div>
  <div class="legend panel" id="legend" hidden><button class="legend-head" id="legendHead" aria-expanded="true"><span>виды узлов</span><span id="legendArrow">свернуть</span></button><div class="legend-list" id="legendList"></div></div>
</div>

<div class="screen show" id="scrMenu">
  <div class="card panel">
    <div class="titlebar"><span class="path">~/root</span><span class="led"></span></div>
    <div class="body">
      <h1 class="wordmark"><span id="wm">root</span><span class="caret"></span></h1>
      <p class="tagline">сетевая стратегия</p>
      <div class="stack">
        <button class="btn primary" data-go="scrCampaign"><span class="lbl">кампания</span><span class="hint" id="campHint"></span></button>
        <button class="btn" data-go="scrQuick"><span class="lbl">быстрая игра</span></button>
        <button class="btn" id="btnLive"><span class="lbl">живая сеть</span><span class="hint" id="liveHint"></span></button>
        <button class="btn" id="btnSandbox"><span class="lbl">песочница</span><span class="hint">10 видов узлов</span></button>
        <button class="btn" data-go="scrHow"><span class="lbl">как играть</span></button>
      </div>
      <div class="settings">
        <button class="toggle" id="tgMusic"><span>музыка</span><span class="state"></span></button>
        <button class="toggle" id="tgSfx"><span>звуковые эффекты</span><span class="state"></span></button>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="scrCampaign">
  <div class="card panel wide">
    <div class="titlebar"><button class="back" data-go="scrMenu">&lt; назад</button><span class="path">~/root/кампания</span></div>
    <div class="body"><div class="grid" id="levelGrid"></div></div>
  </div>
</div>

<div class="screen" id="scrQuick">
  <div class="card panel">
    <div class="titlebar"><button class="back" data-go="scrMenu">&lt; назад</button><span class="path">~/root/быстрая-игра</span></div>
    <div class="body">
      <div class="form-row"><label>соперники</label>
        <div class="seg" id="segOpp" style="--n:3"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>
      <div class="form-row"><label>сложность</label>
        <div class="seg" id="segDiff" style="--n:3"><button data-v="easy">низкая</button><button data-v="normal">средняя</button><button data-v="hard">высокая</button></div></div>
      <div class="form-row"><label>размер сети</label>
        <div class="seg" id="segMap" style="--n:3"><button data-v="0">малая</button><button data-v="1">средняя</button><button data-v="2">большая</button></div></div>
      <div class="stack" style="margin-top:10px"><button class="btn primary" id="btnQuickStart"><span class="lbl">начать</span></button></div>
    </div>
  </div>
</div>

<div class="screen" id="scrHow">
  <div class="card panel wide">
    <div class="titlebar"><button class="back" data-go="scrMenu">&lt; назад</button><span class="path">~/root/справка</span></div>
    <div class="body">
      <div class="howto" id="howList"></div>
      <div class="stack"><button class="btn primary" id="btnHowPlay"><span class="lbl">начать первый уровень</span></button></div>
    </div>
  </div>
</div>

<div class="screen" id="scrPause">
  <div class="card panel">
    <div class="titlebar"><span class="path">процесс приостановлен</span><span class="led"></span></div>
    <div class="body">
      <div class="stack">
        <button class="btn primary" id="btnResume"><span class="lbl">продолжить</span><span class="hint">esc</span></button>
        <button class="btn" id="btnRestart"><span class="lbl">начать заново</span></button>
        <button class="btn" id="btnQuit"><span class="lbl">выйти в меню</span></button>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="scrEnd">
  <div class="card panel">
    <div class="titlebar"><span class="path" id="endPath"></span><span class="led"></span></div>
    <div class="body">
      <h2 class="end-title" id="endTitle"></h2>
      <p class="end-sub" id="endSub"></p>
      <div class="stats">
        <div><b id="stTime">0:00</b><span>время</span></div>
        <div><b id="stCap">0</b><span>взломано</span></div>
        <div><b id="stBuilt">0</b><span>пик мощности</span></div>
      </div>
      <div class="stack">
        <button class="btn primary" id="btnEndMain"><span class="lbl" id="endMainLbl"></span></button>
        <button class="btn" id="btnEndMenu"><span class="lbl">в меню</span></button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
document.documentElement.lang = 'ru';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
