<meta charset="utf-8">
<title>Раскладки поля</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Dark flat, one committed look for page and scene alike. */
:root{
  color-scheme:dark;
  --bg:#0b0d10; --panel:#14171c; --line:#242933; --ink:#e7eaf0; --mut:#8a93a3;
  --s-bg:#101216; --s-surf:#15181e; --s-cell:#1b1f27; --s-line:#262b35; --s-off:#2a303b;
  --tp:#2dd4bf; --te:#f472b6; --mana:#38bdf8; --gold:#fbbf24;
  --fd:"Unbounded",system-ui,sans-serif; --fb:"Manrope",system-ui,sans-serif; --fm:"JetBrains Mono",ui-monospace,monospace;
}
html,body{background:var(--bg);}
body{color:var(--ink); font:15px/1.5 var(--fb);}
.wrap{max-width:1320px; margin:0 auto; padding-inline:16px; padding-block:28px 48px; display:grid; gap:18px;}
.eyebrow{margin:0; font:500 12px/1.4 var(--fm); letter-spacing:.06em; text-transform:uppercase; color:var(--mut);}
h1{margin:6px 0; font:700 clamp(24px,3.6vw,36px)/1.15 var(--fd); letter-spacing:-.01em; text-wrap:balance;}
.lede{margin:0; max-width:70ch; color:var(--mut);}

.tabs{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px;}
.tab{all:unset; box-sizing:border-box; cursor:pointer; display:grid; grid-template-columns:auto 1fr; column-gap:10px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line); min-width:0;}
.tab:hover{border-color:#3a4150;}
.tab:focus-visible{outline:2px solid var(--tp); outline-offset:2px;}
.tab[aria-selected="true"]{background:var(--ink); color:#0b0d10; border-color:var(--ink);}
.tab .key{grid-row:1/3; width:22px; height:22px; display:grid; place-items:center; border-radius:6px; border:1px solid currentColor; font:500 12px/1 var(--fm); opacity:.6;}
.tab .nm{font:700 13px/1.25 var(--fd); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tab .sub{font-size:12px; opacity:.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tab .fav{color:var(--gold); margin-left:4px;}
.tab[aria-selected="true"] .fav{color:#b45309;}

.stage{position:relative; width:100%; aspect-ratio:1280/900; max-width:100%; overflow:hidden; border-radius:14px; background:var(--s-bg); border:1px solid var(--line);}
.info{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:18px; align-items:start;}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 22px;}
.about h2{margin:4px 0 2px; font:700 28px/1.15 var(--fd);}
.about .like{margin:0 0 12px; color:var(--mut);}
.about .desc{margin:0 0 14px; max-width:65ch;}
.rules{margin:0 0 16px; padding:0; list-style:none; display:grid; gap:6px; counter-reset:r;}
.rules li{display:grid; grid-template-columns:22px 1fr; gap:8px; counter-increment:r;}
.rules li::before{content:counter(r); width:22px; height:22px; border-radius:6px; background:var(--s-cell); color:var(--mut); display:grid; place-items:center; font:700 11px var(--fd);}
.meta{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 20px; margin:0 0 14px;}
.meta dt,.label{font:500 11px/1.4 var(--fm); letter-spacing:.06em; text-transform:uppercase; color:var(--mut);}
.meta dd{margin:4px 0 0;}
.meter{display:inline-flex; gap:3px;}
.meter i{width:18px; height:8px; border-radius:2px; background:var(--s-off);}
.meter i.on{background:var(--ink);}
.pm{display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; margin:0 0 16px;}
.pm p{margin:4px 0 0;}
.tiers{margin:0 0 16px; padding:12px 14px; border-radius:10px; background:var(--s-cell);}
.tiers p{margin:4px 0 0;}
.btn{all:unset; cursor:pointer; box-sizing:border-box; display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; font:700 13px var(--fd); background:var(--ink); color:#0b0d10;}
.btn.on{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--gold);}
.btn:focus-visible{outline:2px solid var(--tp); outline-offset:2px;}
.btn .star{color:var(--gold);}
.btn:not(.on) .star{color:inherit;}
.picks h3{margin:0 0 8px; font:700 15px var(--fd);}
.picks ul{list-style:none; margin:0 0 12px; padding:0; display:grid; gap:6px;}
.picks li button{all:unset; cursor:pointer; text-decoration:underline; text-underline-offset:3px;}
.picks li button:focus-visible{outline:2px solid var(--tp);}
.picks p{margin:0 0 10px; color:var(--mut); font-size:14px;}
kbd{font:500 12px var(--fm); border:1px solid var(--line); border-radius:4px; padding:0 5px; color:var(--ink);}
.legend{display:flex; flex-wrap:wrap; justify-content:center; gap:22px 20px; padding:22px 16px 26px; border-radius:14px; background:var(--s-bg); border:1px solid var(--line);}
.legend .lg{display:grid; justify-items:center; gap:12px;}
.legend .cap{font:700 11px/1.2 var(--fd); color:var(--mut);}
.legend .cap b{color:var(--ink);}
@media (max-width:900px){
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));}
  .info{grid-template-columns:1fr;}
  .meta{grid-template-columns:1fr;}
  .pm{grid-template-columns:1fr;}
}

/* ---------- Scene ---------- */
.scene{position:absolute; left:0; top:0; width:1280px; height:900px; transform-origin:0 0; background:var(--s-bg); overflow:hidden; font-family:var(--fb); color:var(--ink); transition:opacity .16s;}
.scene.swap{opacity:0;}
.scene > *{position:absolute;}
.lay{left:0; top:0; width:1280px; height:900px; pointer-events:none; overflow:visible;}
.lay.over{z-index:25;}
.surface{background:var(--s-surf); border-radius:28px;}
.box{background:var(--s-surf); border-radius:16px;}
.slot{box-sizing:border-box; border:1.5px dashed var(--s-line); border-radius:14px;}
.slot.round{border-radius:50%;}
.hline{background:var(--s-line); height:2px;}
.pill{box-sizing:border-box; padding:5px 12px; border-radius:999px; background:var(--s-cell); color:var(--mut); font:700 12px/1.2 var(--fd); white-space:nowrap;}
.pill b{color:var(--ink); font-weight:700;}
.pill.hot{background:var(--te); color:#101216;}
.pill.cool{background:var(--tp); color:#101216;}
.pill.lite{background:var(--ink); color:#101216;}
.lbl{font:700 11px/1.2 var(--fd); color:var(--mut); letter-spacing:.04em; text-transform:uppercase; white-space:nowrap;}
.note{box-sizing:border-box; padding:12px 14px; border-radius:14px; background:var(--s-surf); font:500 12.5px/1.4 var(--fb); color:var(--mut);}
.note b{display:block; margin-bottom:4px; font:700 12px/1.2 var(--fd); color:var(--ink);}

.dots{display:inline-flex; gap:2px;}
.dots i{width:5px; height:5px; border-radius:50%; background:var(--s-off);}

svg.i{display:block; width:100%; height:auto;}
.tok,.tile,.chip,.hc,.up{--tint:color-mix(in srgb,var(--t) 16%,#1b1f27);}
svg.i *{fill:var(--t);}
svg.i .k{fill:var(--tint);}

.st{position:absolute; bottom:-8px; box-sizing:border-box; min-width:28px; height:26px; padding:0 6px; border-radius:9px; font:700 13px/26px var(--fd); text-align:center; font-variant-numeric:tabular-nums; z-index:2;}
.st.a{left:-6px; background:var(--ink); color:#101216;}
.st.h{right:-6px; background:#101216; color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink);}
.st.h.d{color:#f87171; box-shadow:inset 0 0 0 2px #f87171;}
.st.p{left:50%; translate:-50% 0; background:var(--ink); color:#101216;}
.st.p.bonus{background:var(--tp);}
.st.p.down{background:var(--mana);}

.tok{position:relative; flex:none; box-sizing:border-box; border-radius:14px; background:var(--tint); box-shadow:inset 0 -4px 0 var(--t); display:grid; place-items:center;}
.tok .dots{position:absolute; top:9px; left:50%; translate:-50% 0;}
.tok .ic{width:min(54%, calc(var(--h) * .44));}
.tok.taunt{box-shadow:inset 0 -4px 0 var(--t), 0 0 0 3px var(--s-surf), 0 0 0 5px #6b7280;}
.tok.taunt::before{content:""; position:absolute; left:-8px; top:-8px; width:20px; height:22px; background:var(--ink); clip-path:polygon(50% 0,100% 18%,92% 70%,50% 100%,8% 70%,0 18%); z-index:2;}
.tok.shield{box-shadow:inset 0 -4px 0 var(--t), 0 0 0 3px var(--s-surf), 0 0 0 5px var(--gold);}
.tok.sel,.tile.sel,.chip.sel{outline:2px solid var(--tp); outline-offset:7px;}
.tok.sel{translate:0 -8px;}
.tok.target,.tile.target,.chip.target{outline:2px dashed var(--te); outline-offset:7px;}
.tok .price{position:absolute; top:-9px; right:-9px; width:26px; height:26px; border-radius:50%; background:var(--gold); color:#101216; font:700 12px/26px var(--fd); text-align:center; z-index:2;}
.tok.gold{box-shadow:inset 0 -4px 0 var(--t), 0 0 0 3px var(--s-surf), 0 0 0 5px var(--gold);}
.tok .goldb{position:absolute; top:-9px; left:-9px; width:24px; height:24px; border-radius:50%; background:var(--gold); color:#101216; font:700 13px/24px var(--fd); text-align:center; z-index:2;}
.tok .tl{position:absolute; left:50%; bottom:-12px; translate:-50% 0; white-space:nowrap; font:700 10px/1 var(--fd); color:var(--mut);}

.tile{box-sizing:border-box; border-radius:12px; background:var(--s-cell); display:grid; grid-template-columns:54px 1fr; overflow:visible;}
.tile .lf{border-radius:12px 0 0 12px; background:var(--tint); box-shadow:inset 3px 0 0 var(--t); display:grid; place-items:center; align-content:center; gap:9px;}
.tile .lf .ic{width:30px;}
.tile .dots{gap:1.5px;}
.tile .dots i{width:4.5px; height:4.5px;}
.tile .rt{padding:9px 8px 8px 10px; display:flex; flex-direction:column; justify-content:space-between; min-width:0;}
.tile .rt b{font:800 11px/1.2 var(--fb); overflow-wrap:anywhere;}
.tile .sts{display:flex; gap:5px;}
.tile .st{position:static; min-width:24px; height:22px; font-size:11px; line-height:22px; border-radius:7px; padding:0 5px;}

.chip{width:var(--s); height:var(--s); border-radius:50%; display:grid; place-items:center;}
.chip .bd{position:absolute; inset:0; border-radius:50%; background:var(--tint); box-shadow:inset 0 0 0 3px var(--t);}
.chip.tm-p .bd{box-shadow:inset 0 0 0 3px var(--t), 0 0 0 3px var(--s-bg), 0 0 0 5px var(--tp);}
.chip.tm-e .bd{box-shadow:inset 0 0 0 3px var(--t), 0 0 0 3px var(--s-bg), 0 0 0 5px var(--te);}
.chip .ic{position:relative; width:50%;}
.chip .tn{position:absolute; top:-9px; left:50%; translate:-50% 0; width:19px; height:19px; border-radius:50%; background:var(--t); color:#101216; font:700 10px/19px var(--fd); text-align:center; z-index:2;}
.chip .st{bottom:-7px; min-width:22px; height:20px; padding:0 4px; border-radius:7px; font-size:11px; line-height:20px;}
.chip .st.a{left:-9px;} .chip .st.h{right:-9px;}
.chip.hex{border-radius:22%;}
.chip.hex .bd{border-radius:0; box-shadow:none; background:var(--t); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
.chip.hex.tm-p .bd{background:var(--tp);} .chip.hex.tm-e .bd{background:var(--te);}
.chip.hex .bd::after{content:""; position:absolute; inset:4px; background:var(--tint); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
.chip.gen .bd{background:color-mix(in srgb,var(--team) 18%,#1b1f27); box-shadow:inset 0 0 0 4px var(--team);}
.chip.gen svg.i *{fill:var(--team);}
.chip.gen svg.i .k{fill:color-mix(in srgb,var(--team) 18%,#1b1f27);}
.chip.gen .st.h{right:-10px;}

.hbar{height:6px; border-radius:3px; background:var(--s-off); overflow:hidden;}
.hbar b{display:block; height:100%; background:var(--te);}

.hero{box-sizing:border-box; width:250px; padding:10px 14px 10px 10px; border-radius:16px; background:var(--s-surf); display:grid; grid-template-columns:48px 1fr; gap:12px; align-items:center;}
.hero .ava{width:48px; height:48px; border-radius:50%; background:color-mix(in srgb,var(--team) 18%,#1b1f27); display:grid; place-items:center;}
.hero .ava .ic{width:30px;}
.hero .ava svg.i *{fill:var(--team);}
.hero .ava svg.i .k{fill:color-mix(in srgb,var(--team) 18%,#1b1f27);}
.hero b{font:700 13px/1.2 var(--fd);}
.hero .hbar{margin:6px 0 4px;}
.hero .hbar b{background:var(--team);}
.hero small{font:600 12px/1 var(--fb); color:var(--mut); font-variant-numeric:tabular-nums;}
.ehand{display:flex; gap:5px;}
.ehand i{width:30px; height:42px; border-radius:6px; background:var(--s-cell); box-shadow:inset 0 0 0 1.5px var(--s-line);}
.mana{display:flex; align-items:center; gap:10px;}
.mana b{font:700 14px/1 var(--fd); color:var(--mana); font-variant-numeric:tabular-nums;}
.gems{display:flex; gap:4px;}
.gems i{width:12px; height:18px; border-radius:4px; background:var(--s-off);}
.gems i.on{background:var(--mana);}
.endt{position:absolute; box-sizing:border-box; border:0; width:180px; height:42px; border-radius:999px; background:var(--ink); color:#101216; font:700 13px/42px var(--fd); text-align:center; cursor:pointer;}

.hc{position:absolute; bottom:16px; width:108px; height:152px; box-sizing:border-box; border-radius:14px; background:var(--s-cell); box-shadow:0 0 0 1px var(--s-line), 0 10px 22px rgba(0,0,0,.45); transform-origin:50% 100%; transition:transform .15s ease; z-index:5;}
.hc:hover{transform:translateY(-18px) scale(1.35); z-index:40;}
.hc.ok{box-shadow:0 0 0 2px var(--mana), 0 10px 22px rgba(0,0,0,.45);}
.hc .art{position:relative; margin:8px 8px 0; height:60px; border-radius:10px; background:var(--tint); box-shadow:inset 0 -3px 0 var(--t); display:grid; place-items:center;}
.hc .art .ic{width:34px; margin-top:-8px;}
.hc .art .dots{position:absolute; bottom:8px; left:50%; translate:-50% 0;}
.hc .nm{display:block; margin:8px 8px 3px; font:800 11.5px/1.15 var(--fb);}
.hc p{margin:0 8px; font:500 9.5px/1.3 var(--fb); color:var(--mut);}
.hc .st{bottom:-10px;} .hc .st.a{left:6px;} .hc .st.h{right:6px;}
.hc .cost{position:absolute; top:-9px; left:-9px; width:28px; height:28px; border-radius:50%; background:var(--s-off); color:var(--mut); font:700 13px/28px var(--fd); text-align:center; z-index:2;}
.hc.ok .cost{background:var(--mana); color:#101216;}

.lb{box-sizing:border-box; display:grid; grid-template-columns:36px 1fr auto; gap:10px; align-items:center; padding:8px 10px; border-radius:12px; background:var(--s-surf);}
.lb.me{box-shadow:inset 3px 0 0 var(--tp); background:#171d22;}
.lb.next{box-shadow:inset 3px 0 0 var(--te);}
.lb.out{opacity:.4;}
.lb .ava{width:36px; height:36px; border-radius:50%; background:var(--s-cell); display:grid; place-items:center;}
.lb .ava .ic{width:22px;}
.lb .ava svg.i *{fill:var(--ink);} .lb .ava svg.i .k{fill:var(--s-cell);}
.lb b{display:block; font:700 11.5px/1.2 var(--fd); white-space:nowrap;}
.lb .hbar{margin-top:5px; height:5px;}
.lb .hbar b{background:var(--ink);}
.lb.me .hbar b{background:var(--tp);}
.lb.next .hbar b{background:var(--te);}
.lb .tv{font:700 11px/1 var(--fd); color:var(--mut); text-align:right;}
.lb .tv small{display:block; margin-top:3px; font:600 10px/1 var(--fb);}

.up{box-sizing:border-box; width:96px; height:118px; border-radius:14px; background:var(--s-cell); display:grid; justify-items:center; align-content:start; gap:6px; padding-top:10px;}
.up .circ{width:52px; height:52px; border-radius:50%; background:var(--tint); box-shadow:inset 0 0 0 3px var(--t); display:grid; place-items:center;}
.up .circ .ic{width:28px;}
.up b{font:700 11px/1 var(--fd);}
.up small{font:700 10px/1 var(--fd); color:var(--gold);}

.hub{box-sizing:border-box; border-radius:50%; background:var(--s-cell); display:grid; place-items:center; align-content:center; text-align:center; gap:2px;}
.hub b{font:700 22px/1 var(--fd); color:var(--mana);}
.hub span{font:700 10px/1.25 var(--fd); color:var(--mut); text-transform:uppercase; letter-spacing:.04em;}

@media (prefers-reduced-motion: reduce){ .scene,.hc{transition:none;} }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Стиль «Флэт», тёмная тема · юниты 7 тиров · 10 раскладок поля</p>
    <h1>Раскладки поля</h1>
    <p class="lede">Цвета и антураж те же, меняется устройство поля: ряды, сетки как в Cross Blitz, локации, гексы, таверна, кольцо. Бирюзовая обводка у ваших юнитов, розовая у врагов. Голубая рамка у карты значит, что на неё хватает маны.</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Раскладки"></nav>
  <div class="stage" id="stage"><div class="scene" id="scene"></div></div>
  <section class="info">
    <div class="panel about" id="about"></div>
    <aside class="panel picks" id="picks"></aside>
  </section>
  <section class="legend" id="legend" aria-label="Семь тиров"></section>
</div>

  mage:`<path d="M28 0l14 26H14z"/><rect x="6" y="25" width="44" height="6" rx="3"/><path d="M16 33h24l8 29H8z"/><circle class="k" cx="22" cy="39" r="2.4"/><circle class="k" cx="34" cy="39" r="2.4"/><rect x="51" y="18" width="3.5" height="44"/><path d="M52.7 2l3 7 6.3 1-4.6 4.5 1.4 6.5-6.1-3.4-6.1 3.4 1.4-6.5-4.6-4.5 6.3-1z"/>`,
  gryphon:`<path d="M2 18C14 4 30 6 36 16c-8 0-10 4-6 8-8-2-12 2-8 8-8-2-16-6-20-14z"/><path d="M26 22h32v18c0 12-8 18-16 22-8-4-16-10-16-22z"/><path class="k" d="M40 27h4v28h-4zM31 36h22v4H31z"/>`,

const TIER_NAMES = ['Рекрут','Боец','Ветеран','Элита','Герой','Легенда','Миф'];

const TP = '#2dd4bf', TE = '#f472b6', INK = '#e7eaf0', MANA = '#38bdf8';

/* ---------- building blocks ---------- */
const tc = k => TIERS[U[k].tier - 1];
const P = (x, y, w, h) => `left:${x}px;top:${y}px;` + (w != null ? `width:${w}px;` : '') + (h != null ? `height:${h}px;` : '');
const ic = k => `<div class="ic"><svg class="i" viewBox="0 0 64 64" aria-hidden="true">${ICONS[k]}</svg></div>`;
const dots = n => `<span class="dots">${[1,2,3,4,5,6,7].map(i => `<i${i <= n ? ` style="background:${TIERS[n-1]}"` : ''}></i>`).join('')}</span>`;
const stats = (u, hp) => `<span class="st a">${u.atk}</span><span class="st h${hp < u.hp ? ' d' : ''}">${hp}</span>`;
const pow = k => U[k].atk + U[k].tier;

function tok(k, o = {}){
  const u = U[k], hp = o.hp ?? u.hp, w = o.w || 104, h = o.h || 136;
  const cl = ['tok', u.taunt && !o.plain && 'taunt', u.shield && !o.plain && 'shield', o.sel && 'sel', o.target && 'target', o.gold && 'gold'].filter(Boolean).join(' ');
  const pos = o.x != null ? `position:absolute;${P(o.x, o.y)}` : '';
  let st = '';
  if (o.power != null) st = `<span class="st p${o.pcls ? ' ' + o.pcls : ''}">${o.power}</span>`;
  else if (!o.nostats) st = stats(u, hp);
  return `<div class="${cl}" style="--t:${tc(k)};--h:${h}px;width:${w}px;height:${h}px;${pos}" title="${u.name} · тир ${u.tier}">${dots(u.tier)}${ic(k)}${st}`
    + (o.price != null ? `<span class="price">${o.price}</span>` : '') + (o.gold ? '<span class="goldb">★</span>' : '')
    + (o.label ? `<span class="tl">${o.label}</span>` : '') + `</div>`;
}
function tile(k, o){
  const u = U[k], hp = o.hp ?? u.hp;
  const cl = ['tile', o.sel && 'sel', o.target && 'target'].filter(Boolean).join(' ');
  return `<div class="${cl}" style="--t:${tc(k)};${P(o.x, o.y, o.w, o.h)}" title="${u.name} · тир ${u.tier}"><div class="lf">${ic(k)}${dots(u.tier)}</div><div class="rt"><b>${u.name}</b><div class="sts">${stats(u, hp)}</div></div></div>`;
}
function chip(k, o){
  const u = U[k], hp = o.hp ?? u.hp, s = o.s || 64;
  const cl = ['chip', o.team && 'tm-' + o.team, o.sel && 'sel', o.target && 'target', o.hex && 'hex'].filter(Boolean).join(' ');
  return `<div class="${cl}" style="--t:${tc(k)};--s:${s}px;${P(o.x - s/2, o.y - s/2)}" title="${u.name} · тир ${u.tier}"><i class="bd"></i>${ic(k)}`
    + (o.bare ? '' : `<span class="tn">${u.tier}</span>${stats(u, hp)}`) + `</div>`;
}
function gen(icon, team, hp, x, y, s = 76, extra = ''){
  return `<div class="chip gen ${extra}" style="--team:${team === 'p' ? TP : TE};--t:${team === 'p' ? TP : TE};--s:${s}px;${P(x - s/2, y - s/2)}"><i class="bd"></i>${ic(icon)}<span class="st h">${hp}</span></div>`;
}
const slot = (x, y, w, h, round) => `<div class="slot${round ? ' round' : ''}" style="${P(x, y, w, h)}"></div>`;
const pill = (txt, style, cls = '') => `<div class="pill ${cls}" style="${style}">${txt}</div>`;

function hero(side, o){
  return `<div class="hero" style="--team:${side === 'p' ? TP : TE};${P(o.x, o.y)}"><div class="ava">${ic(o.icon)}</div><div><b>${o.name}</b><div class="hbar"><b style="width:${o.hp / o.max * 100}%"></b></div><small>${o.hp} / ${o.max}${o.armor ? ` · броня ${o.armor}` : ''}</small></div></div>`;
}
function mana(n, max, style){
  return `<div class="mana" style="${style}"><b>${n}/${max}</b><span class="gems">${Array.from({length:max}, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span></div>`;
}
function hand(keys, m, o = {}){
  const n = keys.length, W = 108, G = 12, x0 = 640 - (n * W + (n - 1) * G) / 2;
  return keys.map((k, i) => {
    const u = U[k], ok = o.nocost ? false : u.cost <= m;
    return `<div class="hc${ok ? ' ok' : ''}" style="--t:${tc(k)};left:${x0 + i * (W + G)}px">${o.nocost ? '' : `<span class="cost">${u.cost}</span>`}<div class="art">${ic(k)}${dots(u.tier)}</div><b class="nm">${u.name}</b><p>${u.text}</p>${stats(u, u.hp)}</div>`;
  }).join('');
}
/* Arrow in scene coordinates; optional dashed target ring. */
function arrow(ax, ay, bx, by, o = {}){
  const color = o.color || INK, bend = o.bend || 0, w = o.w || 4;
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
  const cx = (ax + bx) / 2 - dy / len * bend, cy = (ay + by) / 2 + dx / len * bend;
  const ang = Math.atan2(by - cy, bx - cx), stop = o.stop ?? 6;
  const hx = bx - Math.cos(ang) * stop, hy = by - Math.sin(ang) * stop, L = 16, W = 9;
  const bx0 = hx - Math.cos(ang) * L, by0 = hy - Math.sin(ang) * L, px = -Math.sin(ang), py = Math.cos(ang);
  let s = `<path d="M${ax} ${ay} Q${cx} ${cy} ${bx0} ${by0}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
  s += `<polygon points="${hx},${hy} ${bx0 + px * W},${by0 + py * W} ${bx0 - px * W},${by0 - py * W}" fill="${color}"/>`;
  if (o.ring) s += `<circle cx="${bx}" cy="${by}" r="${o.ring}" fill="none" stroke="${color}" stroke-width="2.5" stroke-dasharray="6 6"/>`;
  return s;
}
const svg = (inner, over) => `<svg class="lay${over ? ' over' : ''}" viewBox="0 0 1280 900" aria-hidden="true">${inner}</svg>`;

/* Shared frame: enemy on top, you at the bottom. */
function frame(o = {}){
  let h = '';
  if (o.enemy !== false){
    h += hero('e', {x:24, y:18, name:'Король-лич', hp:24, max:30, icon:'lich'});
    h += `<div class="ehand" style="${P(640 - 85, 18)}">${'<i></i>'.repeat(5)}</div>`;
    h += mana(o.eMana ?? 5, o.eMax ?? 7, 'right:24px;top:26px');
    h += pill('Колода <b>15</b>', 'right:24px;top:58px');
  }
  if (o.player !== false) h += hero('p', {x:24, y:790, name:'Верховный маг', hp:18, max:30, armor:3, icon:'mage'});
  if (o.hand !== false) h += hand(o.handKeys || HAND, o.mana ?? 6, o.handOpts);
  if (o.controls !== false){
    h += pill('Колода <b>18</b>', 'right:24px;top:748px');
    h += mana(o.mana ?? 6, o.manaMax ?? 8, 'right:24px;top:790px');
    h += `<div class="endt" style="right:24px;top:832px" role="button" tabindex="-1">${o.endLabel || 'Конец хода'}</div>`;
  }
  return h;
}

    let h = svg(s);
    h += `<div class="hub" style="${P(C[0] - 62, C[1] - 62, 124, 124)}"><b>1</b><span>ход до<br>поворота</span></div>`;
    const inner = ['angel','fire','gryphon','militia','archer',null], outer = ['golem','wolf','necro',null,'kraken','dragon'];
    inner.forEach((k, i) => { const [x, y] = pt(140, i); h += k ? chip(k, {x, y, s:70, team:'p', sel:k === 'angel', hp:k === 'gryphon' ? 2 : undefined}) : slot(x - 35, y - 35, 70, 70, true); });
    outer.forEach((k, i) => { const [x, y] = pt(280, i); h += k ? chip(k, {x, y, s:70, team:'e', target:k === 'golem'}) : slot(x - 35, y - 35, 70, 70, true); });
    const a = pt(140, 0), b = pt(280, 0), d = pt(280, 3);
    h += svg(arrow(a[0], a[1] - 44, b[0], b[1] + 46, {w:4, stop:0}), true);
    h += pill('−2 герою', P(d[0] + 44, d[1] - 14), 'hot');
    h += `<div class="note" style="${P(960, 300, 280)}"><b>Через поворот</b>Дракон доедет до луча с Архангелом, а на луч Ополченца встанет Кракен.</div>`;
    return h + frame();
  }
},
];

/* ---------- page ---------- */
const $ = s => document.querySelector(s);
const stage = $('#stage'), scene = $('#scene');
let cur = 0, favs = [];
try { favs = JSON.parse(localStorage.getItem('boardLayoutFavs') || '[]'); } catch (e) { favs = []; }
const meter = n => `<span class="meter" aria-label="${n} из 5">${[1,2,3,4,5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;

function renderTabs(){
  $('#tabs').innerHTML = LAYOUTS.map((L, i) => `<button class="tab" role="tab" type="button" id="tab-${L.id}" aria-selected="${i === cur}" data-i="${i}"><span class="key">${(i + 1) % 10}</span><span class="nm">${L.name}${favs.includes(L.id) ? '<span class="fav" aria-label="в шорт-листе">★</span>' : ''}</span><span class="sub">${L.like}</span></button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => select(+b.dataset.i));
}
function renderAbout(){
  const L = LAYOUTS[cur], on = favs.includes(L.id);
  $('#about').innerHTML = `<p class="eyebrow">Раскладка ${cur + 1} из 10</p><h2>${L.name}</h2><p class="like">${L.like}</p><p class="desc">${L.desc}</p>
    <ol class="rules">${L.rules.map(r => `<li>${r}</li>`).join('')}</ol>
    <div class="tiers"><span class="label">Как работают 7 тиров</span><p>${L.tiers}</p></div>
    <dl class="meta"><div><dt>Глубина тактики</dt><dd>${meter(L.depth)}</dd></div><div><dt>Простота для новичка</dt><dd>${meter(L.easy)}</dd></div><div><dt>Длина партии</dt><dd>${meter(L.len)}</dd></div></dl>
    <div class="pm"><div><span class="label">Сильная сторона</span><p>${L.plus}</p></div><div><span class="label">Риск</span><p>${L.minus}</p></div></div>
    <button class="btn${on ? ' on' : ''}" id="fav" type="button" aria-pressed="${on}"><span class="star">${on ? '★' : '☆'}</span>${on ? 'В шорт-листе' : 'Добавить в шорт-лист'}</button>`;
  $('#fav').onclick = () => { favs = favs.includes(L.id) ? favs.filter(f => f !== L.id) : [...favs, L.id]; try { localStorage.setItem('boardLayoutFavs', JSON.stringify(favs)); } catch (e) {} renderTabs(); renderAbout(); renderPicks(); };
}
function renderPicks(){
  const list = LAYOUTS.filter(L => favs.includes(L.id));
  $('#picks').innerHTML = `<h3>Шорт-лист</h3>${list.length ? `<ul>${list.map(L => `<li><button type="button" data-go="${L.id}">${L.name}</button> · ${L.like}</li>`).join('')}</ul>` : '<p>Пока пусто. Отметьте раскладки, которые хочется попробовать.</p>'}
    <p>Раскладки можно смешивать: например, сетка 4×3 и таверна с тирами между боями.</p><p><kbd>1</kbd>–<kbd>0</kbd> или <kbd>←</kbd> <kbd>→</kbd> переключают раскладки. Наведите на карту в руке, чтобы её увеличить.</p>`;
  $('#picks').querySelectorAll('[data-go]').forEach(b => b.onclick = () => select(LAYOUTS.findIndex(L => L.id === b.dataset.go)));
}
function paint(){ scene.innerHTML = LAYOUTS[cur].render(); }
function select(i, instant){
  cur = (i + LAYOUTS.length) % LAYOUTS.length;
  renderTabs(); renderAbout(); renderPicks();
  try { history.replaceState(null, '', '#' + LAYOUTS[cur].id); localStorage.setItem('boardLayoutLast', LAYOUTS[cur].id); } catch (e) {}
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches){ paint(); return; }
  scene.classList.add('swap'); setTimeout(() => { paint(); scene.classList.remove('swap'); }, 150);
}
function fit(){ scene.style.transform = `scale(${stage.clientWidth / 1280})`; }
new ResizeObserver(fit).observe(stage);
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (/^[0-9]$/.test(e.key)) select(e.key === '0' ? 9 : +e.key - 1);
  else if (e.key === 'ArrowRight') select(cur + 1);
  else if (e.key === 'ArrowLeft') select(cur - 1);
});
$('#legend').innerHTML = ['militia','archer','mage','gryphon','fire','angel','dragon'].map((k, i) => `<div class="lg">${tok(k, {plain:true})}<span class="cap"><b>Тир ${i + 1}</b> · ${TIER_NAMES[i]}</span></div>`).join('');
(function start(){
  let id = location.hash.slice(1);
  if (!LAYOUTS.some(L => L.id === id)){ try { id = localStorage.getItem('boardLayoutLast') || ''; } catch (e) { id = ''; } }
  const i = LAYOUTS.findIndex(L => L.id === id);
  select(i < 0 ? 0 : i, true); fit();
})();
</script>
