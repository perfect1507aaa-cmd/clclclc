<meta charset="utf-8">
<title>Стили карточной битвы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya:wght@400;700&family=Cormorant+SC:wght@600;700&family=Cormorant+Garamond:wght@500;700&family=Russo+One&family=JetBrains+Mono:wght@400;800&family=Press+Start+2P&family=Pixelify+Sans:wght@400;700&family=Amatic+SC:wght@700&family=Neucha&family=Ruslan+Display&family=Kurale&family=Playfair+Display+SC:wght@700;900&family=Old+Standard+TT:wght@400;700&family=Prata&family=PT+Serif:wght@400;700&family=Rubik:wght@500;800;900&family=Unbounded:wght@500;700&family=Manrope:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83&display=swap">
<style>
/* ---------- Chrome (page around the scene) ---------- */
:root{
  --c-bg:#eceef2; --c-surface:#ffffff; --c-ink:#15171c; --c-muted:#5b616d; --c-line:#d6dae1;
  --c-accent:#15171c; --c-accent-ink:#ffffff; --c-star:#c98a00;
  --c-font:"IBM Plex Sans",system-ui,sans-serif; --c-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --c-bg:#111317; --c-surface:#1a1d23; --c-ink:#e8eaee; --c-muted:#9aa0ab; --c-line:#2a2f37;
    --c-accent:#e8eaee; --c-accent-ink:#111317; --c-star:#f2c14e;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --c-bg:#111317; --c-surface:#1a1d23; --c-ink:#e8eaee; --c-muted:#9aa0ab; --c-line:#2a2f37;
  --c-accent:#e8eaee; --c-accent-ink:#111317; --c-star:#f2c14e;
}
html,body{background:var(--c-bg);}
body{color:var(--c-ink); font:15px/1.5 var(--c-font);}
.wrap{max-width:1320px; margin:0 auto; padding-inline:16px; padding-block:28px 48px; display:grid; gap:18px;}
.eyebrow{margin:0; font:500 12px/1.4 var(--c-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--c-muted);}
.top h1{margin:4px 0 6px; font:600 clamp(26px,4vw,38px)/1.1 var(--c-font); letter-spacing:-.01em; text-wrap:balance;}
.top .lede{margin:0; max-width:68ch; color:var(--c-muted);}

.tabs{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px;}
.tab{all:unset; box-sizing:border-box; cursor:pointer; display:grid; grid-template-columns:auto 1fr auto; grid-template-rows:auto auto; column-gap:10px; align-items:center;
  padding:10px 12px; border-radius:10px; background:var(--c-surface); border:1px solid var(--c-line); min-width:0;}
.tab:hover{border-color:var(--c-muted);}
.tab:focus-visible{outline:2px solid var(--c-ink); outline-offset:2px;}
.tab[aria-selected="true"]{background:var(--c-accent); color:var(--c-accent-ink); border-color:var(--c-accent);}
.tab .key{grid-row:1/3; font:500 12px/1 var(--c-mono); width:22px; height:22px; display:grid; place-items:center; border-radius:6px; border:1px solid currentColor; opacity:.6;}
.tab .nm{font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tab .sub{grid-column:2; font-size:12px; opacity:.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tab .sw{grid-row:1/3; grid-column:3; display:flex; gap:2px;}
.tab .sw i{width:8px; height:26px; border-radius:2px;}
.tab .fav{color:var(--c-star); margin-left:4px;}
.tab[aria-selected="true"] .fav{color:inherit;}

.stage{position:relative; width:100%; overflow:hidden; border-radius:12px; background:#000; aspect-ratio:1280/900; max-width:100%;}

.info{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:18px; align-items:start;}
.panel{background:var(--c-surface); border:1px solid var(--c-line); border-radius:12px; padding:20px 22px;}
.about h2{margin:4px 0 2px; font-size:34px; line-height:1.1; font-weight:700;}
.about .tagline{margin:0 0 12px; color:var(--c-muted);}
.about .desc{margin:0 0 16px; max-width:65ch;}
.meta{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 24px; margin:0 0 16px;}
.meta dt{font:500 11px/1.4 var(--c-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--c-muted);}
.meta dd{margin:2px 0 0;}
.meter{display:inline-flex; gap:3px; vertical-align:middle; margin-right:8px;}
.meter i{width:16px; height:8px; border-radius:2px; background:var(--c-line);}
.meter i.on{background:var(--c-ink);}
.swatches{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
.swatches span{display:inline-flex; align-items:center; gap:6px; font:500 12px var(--c-mono); color:var(--c-muted);}
.swatches i{width:22px; height:22px; border-radius:5px; border:1px solid var(--c-line);}
.btn{all:unset; cursor:pointer; box-sizing:border-box; display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:8px; font-weight:600;
  background:var(--c-accent); color:var(--c-accent-ink);}
.btn.on{background:transparent; color:var(--c-ink); box-shadow:inset 0 0 0 1.5px var(--c-star);}
.btn:focus-visible{outline:2px solid var(--c-ink); outline-offset:2px;}
.btn .star{color:var(--c-star);}
.btn:not(.on) .star{color:inherit;}
.picks h3{margin:0 0 8px; font-size:16px;}
.picks ul{list-style:none; margin:0 0 12px; padding:0; display:grid; gap:6px;}
.picks li button{all:unset; cursor:pointer; color:var(--c-ink); text-decoration:underline; text-underline-offset:3px;}
.picks li button:focus-visible{outline:2px solid var(--c-ink);}
.picks p{margin:0 0 10px; color:var(--c-muted); font-size:14px;}
.keys{font:500 12px var(--c-mono); color:var(--c-muted);}
kbd{font:inherit; border:1px solid var(--c-line); border-radius:4px; padding:0 5px; color:var(--c-ink);}

@media (max-width:900px){
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));}
  .info{grid-template-columns:1fr;}
  .meta{grid-template-columns:1fr;}
}

/* ---------- Scene engine (layout only, all looks come from --tokens) ---------- */
.sk{
  --bg:#222; --ink:#fff; --fd:serif; --fb:serif;
  --board:#444; --board-border:none; --board-radius:40px; --board-shadow:none; --board-filter:none;
  --divider:rgba(255,255,255,.25); --divider-h:2px;
  --clip:none; --radius:0; --fw:4px;
  --card-bg:#eee; --card-ink:#222; --card-radius:12px; --card-bw:3px; --card-shadow:0 8px 20px rgba(0,0,0,.4);
  --ribbon-bg:#333; --ribbon-ink:#fff; --ribbon-radius:3px; --ribbon-border:none;
  --name-size:12.5px; --name-weight:700; --name-tt:none; --name-ls:0; --name-stroke:0;
  --txt-size:11px;
  --stat-font:var(--fd); --stat-size:20px; --stat-weight:700; --stat-ink:#fff; --stat-shadow:0 0 3px #000,0 1px 0 #000; --stat-stroke:0;
  --stat-border:none; --stat-w:34px; --stat-h:var(--stat-w);
  --atk-bg:#e0a82e; --hp-bg:#c2352b; --atk-ink:var(--stat-ink); --hp-ink:var(--stat-ink); --atk-r:50%; --hp-r:50%; --atk-clip:none; --hp-clip:none; --dmg:#ffb4a8;
  --armor-bg:linear-gradient(#c8d0d8,#7d8894);
  --cost-bg:#2f6fd6; --cost-ink:#fff; --cost-r:50%; --cost-clip:none; --cost-border:none;
  --mana-on:#2f6fd6; --mana-off:rgba(0,0,0,.4); --gem-r:50%; --gem-clip:none;
  --btn-bg:#e0a82e; --btn-ink:#222; --btn-border:none; --btn-r:10px; --btn-shadow:none; --btn-font:var(--fd); --btn-size:16px; --btn-stroke:0;
  --back:#533; --back-border:3px solid #cc9; --back-r:8px;
  --arrow:#ff4040; --arrow-edge:rgba(0,0,0,.45); --arrow-dash:none;
  --sel:drop-shadow(0 0 4px #7CFC00) drop-shadow(0 0 12px #7CFC00);
  --play:drop-shadow(0 0 3px #36e05a) drop-shadow(0 0 8px #36e05a);
  --plate-bg:rgba(0,0,0,.45); --plate-ink:#fff; --plate-border:none; --plate-r:8px;
  --taunt-bg:linear-gradient(#b8c0c8,#6b7580); --shield-c:rgba(255,230,120,.85);
  --power-r:50%; --power-clip:none;
  --overlay:none;
  font-family:var(--fb); color:var(--ink);
}
.sk :is(.unit,.card,.hero,.power){
  --fbg:var(--t); --pbg:#333; --if:#fff; --is:none; --isw:0; --ik:#000; --ifilter:none; --cb:var(--t);
}
.scene{position:absolute; left:0; top:0; width:1280px; height:900px; transform-origin:0 0; overflow:hidden; background:var(--bg); transition:opacity .18s ease;}
.scene.swap{opacity:0;}
.scene::after{content:""; position:absolute; inset:0; pointer-events:none; background:var(--overlay); z-index:60;}

.board{position:absolute; left:124px; right:140px; top:172px; height:380px;}
.board::before{content:""; position:absolute; inset:0; background:var(--board); border:var(--board-border); border-radius:var(--board-radius); box-shadow:var(--board-shadow); filter:var(--board-filter);}
.divider{position:absolute; left:30px; right:30px; top:50%; height:var(--divider-h); margin-top:calc(var(--divider-h) / -2); background:var(--divider);}
.row{position:absolute; left:0; right:0; display:flex; justify-content:center; gap:22px;}
.row.e{top:16px;} .row.p{bottom:16px;}

.unit{position:relative; width:108px; height:150px; flex:none; isolation:isolate; transition:translate .2s ease;}
.unit .frame,.unit .art{position:absolute; clip-path:var(--clip); border-radius:var(--radius);}
.unit .frame{inset:10px 0 12px; background:var(--fbg);}
.unit .art{inset:calc(10px + var(--fw)) var(--fw) calc(12px + var(--fw)); background:var(--pbg); display:grid; place-items:center; overflow:hidden;}
.unit.sel{filter:var(--sel); translate:0 -8px;}
.unit.taunt::before{content:""; position:absolute; inset:2px -12px 0; z-index:-1; background:var(--taunt-bg);
  clip-path:polygon(50% 0,100% 10%,97% 66%,50% 100%,3% 66%,0 10%);}
.unit.shield::after{content:""; position:absolute; inset:4px -8px 6px; border-radius:50%; pointer-events:none; z-index:2;
  background:radial-gradient(ellipse at 50% 45%, transparent 58%, var(--shield-c) 72%, transparent 76%);
  animation:shimmer 2.4s ease-in-out infinite;}
@keyframes shimmer{50%{opacity:.55;}}

.art svg{width:74%; height:auto; overflow:visible; filter:var(--ifilter);}
.art svg *{fill:var(--if); stroke:var(--is); stroke-width:var(--isw); stroke-linejoin:round; paint-order:stroke;}
.art svg .k{fill:var(--ik);}
.art canvas{width:80%; image-rendering:pixelated; image-rendering:crisp-edges;}

.stat{position:absolute; bottom:0; width:var(--stat-w); height:var(--stat-h); display:grid; place-items:center; z-index:3;
  font:var(--stat-weight) var(--stat-size)/1 var(--stat-font); text-shadow:var(--stat-shadow); border:var(--stat-border);
  -webkit-text-stroke:var(--stat-stroke); paint-order:stroke fill; font-variant-numeric:tabular-nums; box-sizing:border-box;}
.atk{left:-4px; background:var(--atk-bg); color:var(--atk-ink); border-radius:var(--atk-r); clip-path:var(--atk-clip);}
.hp{right:-4px; background:var(--hp-bg); color:var(--hp-ink); border-radius:var(--hp-r); clip-path:var(--hp-clip);}
.hp.dmg{color:var(--dmg);}

.tier{position:absolute; top:0; left:50%; translate:-50% 0; z-index:4; min-width:26px; height:24px; padding:0 6px; box-sizing:border-box;
  display:flex; align-items:center; justify-content:center; gap:2px; font:700 12px/1 var(--fd); white-space:nowrap;}
.tier-shield{height:28px; min-width:30px; color:#fff; text-shadow:0 1px 2px #000; font-size:13px; padding-bottom:4px;
  background:radial-gradient(circle at 50% 25%, color-mix(in srgb,var(--t) 45%,#fff), var(--t) 55%, color-mix(in srgb,var(--t) 55%,#000));
  clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%);}
.tier-diamond{min-width:38px; height:26px; color:#f3ead6; text-shadow:0 1px 2px #000; font-size:13px;
  background:linear-gradient(color-mix(in srgb,var(--t) 70%,#fff),color-mix(in srgb,var(--t) 70%,#000)); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.tier-tag{height:20px; font:800 11px/1 "JetBrains Mono",monospace; color:var(--t); background:#07060f; border:1px solid var(--t); transform:skewX(-14deg); box-shadow:0 0 8px color-mix(in srgb,var(--t) 60%,transparent);}
.tier-pips{height:auto; padding:3px; gap:2px; background:#0b0714; min-width:0;}
.tier-pips i{width:5px; height:5px; background:var(--t);}
.tier-blob{min-width:28px; height:28px; font:700 20px/1 "Amatic SC",cursive; color:#fffdf6; background:color-mix(in srgb,var(--t) 90%,#5b4636); border-radius:52% 48% 45% 55% / 48% 55% 45% 52%;}
.tier-titlo{width:30px; height:30px; padding:4px 0 0; border-radius:50%; background:#120605; border:2px solid #d9a52b; color:#f0c64a; font:700 15px/1 "Kurale",serif;}
.tier-titlo b{position:relative; font-weight:700;}
.tier-titlo b::before{content:""; position:absolute; left:-2px; right:-2px; top:-4px; height:3px; border:1.5px solid currentColor; border-bottom:none;}
.tier-gauge{width:32px; height:32px; padding:0; top:-2px; border-radius:50%; color:#2a1a08; font:900 12px/1 "Playfair Display SC",serif;
  background:radial-gradient(circle, #f3e3b8 0 52%, transparent 53%),
    conic-gradient(from 225deg, var(--t) 0 calc(var(--p) * 270deg), #4a3014 0 270deg, #3a2410 0);
  box-shadow:0 0 0 2px #b5893b, 0 0 0 3px #3a2410;}
.tier-seal{width:26px; height:26px; padding:0; top:2px; border-radius:3px; background:#b3261e; color:#f7f2e6; font:700 15px/1 "Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif; rotate:-5deg; box-shadow:0 0 0 1px rgba(179,38,30,.4);}
.tier-coin{width:30px; height:30px; padding:0; border-radius:50%; background:var(--t); border:3px solid #1b1b3a; color:#fff; font:900 15px/1 "Rubik",sans-serif; -webkit-text-stroke:3px #1b1b3a; paint-order:stroke fill; box-shadow:0 3px 0 #1b1b3a;}
.tier-dots{height:auto; padding:5px 7px; gap:3px; background:#fff; border-radius:999px; box-shadow:0 1px 3px rgba(17,24,39,.15);}
.tier-dots i{width:5px; height:5px; border-radius:50%; background:#d5dae0;}
.tier-dots i.on{background:var(--t);}

/* hand */
.hand{position:absolute; left:0; right:0; bottom:0; height:0;}
.card{position:absolute; left:calc(640px + var(--x) - 64px); bottom:-16px; width:128px; height:184px; box-sizing:border-box;
  transform:translateY(var(--y)) rotate(var(--r)); transform-origin:50% 130%; transition:transform .18s ease;
  background:var(--card-bg); color:var(--card-ink); border:var(--card-bw) solid var(--cb); border-radius:var(--card-radius); box-shadow:var(--card-shadow);}
.card:hover{transform:translateY(-150px) rotate(0deg) scale(1.4); z-index:40 !important;}
.card.playable{filter:var(--play);}
.card .cost{position:absolute; left:-10px; top:-10px; width:34px; height:34px; z-index:4; display:grid; place-items:center; box-sizing:border-box;
  background:var(--cost-bg); color:var(--cost-ink); border-radius:var(--cost-r); clip-path:var(--cost-clip); border:var(--cost-border);
  font:var(--stat-weight) 19px/1 var(--stat-font); text-shadow:var(--stat-shadow); -webkit-text-stroke:var(--stat-stroke); paint-order:stroke fill;}
.c-art{position:absolute; left:10px; right:10px; top:10px; height:78px;}
.c-art .frame,.c-art .art{position:absolute; clip-path:var(--clip); border-radius:var(--radius);}
.c-art .frame{inset:0; background:var(--fbg);}
.c-art .art{inset:var(--fw); background:var(--pbg); display:grid; place-items:center; overflow:hidden;}
.c-art .art svg{width:58%;}
.c-art .art canvas{width:56%;}
.card .tier{left:auto; right:-8px; top:-8px; translate:none;}
.card .name{position:absolute; left:4px; right:4px; top:92px; padding:4px; text-align:center; background:var(--ribbon-bg); color:var(--ribbon-ink);
  border-radius:var(--ribbon-radius); border-block:var(--ribbon-border); font:var(--name-weight) var(--name-size)/1.15 var(--fd);
  text-transform:var(--name-tt); letter-spacing:var(--name-ls); -webkit-text-stroke:var(--name-stroke); paint-order:stroke fill;}
.card .txt{position:absolute; left:9px; right:9px; top:122px; bottom:24px; display:grid; place-items:center; text-align:center; font:var(--txt-size)/1.2 var(--fb);}
.card .stat{bottom:-8px;}
.card .atk{left:-8px;} .card .hp{right:-8px;}

/* heroes */
.hero{position:absolute; left:50%; width:132px; height:150px; margin-left:-66px;}
.hero.e{top:12px;} .hero.p{top:566px;}
.hero .frame,.hero .art{position:absolute; clip-path:var(--clip); border-radius:var(--radius);}
.hero .frame{inset:0; background:var(--fbg);}
.hero .art{inset:var(--fw); background:var(--pbg); display:grid; place-items:center; overflow:hidden;}
.hero .art svg{width:66%;}
.hero .art canvas{width:70%;}
.hero .stat{right:-10px; left:auto; bottom:-4px; width:42px; height:42px; --stat-w:42px; font-size:calc(var(--stat-size) + 2px);}
.hero .armor{bottom:38px; background:var(--armor-bg); color:#fff; border-radius:8px 8px 50% 50%; clip-path:none;}
.plate{background:var(--plate-bg); color:var(--plate-ink); border:var(--plate-border); border-radius:var(--plate-r); font:700 13px/1.2 var(--fd); box-sizing:border-box;}
.h-name{position:absolute; top:50%; right:100%; translate:-14px -50%; white-space:nowrap; padding:5px 12px;}
.power{position:absolute; left:calc(50% + 92px); width:66px; height:66px;}
.power.e{top:52px;} .power.p{top:606px;}
.power .frame,.power .art{position:absolute; border-radius:var(--power-r); clip-path:var(--power-clip);}
.power .frame{inset:0; background:var(--fbg);}
.power .art{inset:4px; background:var(--pbg); display:grid; place-items:center; overflow:hidden;}
.power .art svg{width:60%;}
.power .art canvas{width:62%;}
.power .cost{position:absolute; left:50%; top:-12px; translate:-50% 0; width:26px; height:26px; font-size:14px; display:grid; place-items:center; box-sizing:border-box;
  background:var(--cost-bg); color:var(--cost-ink); border-radius:var(--cost-r); clip-path:var(--cost-clip); border:var(--cost-border);
  font:var(--stat-weight) 14px/1 var(--stat-font); text-shadow:var(--stat-shadow); -webkit-text-stroke:var(--stat-stroke); paint-order:stroke fill; z-index:2;}

/* backs, decks, mana, controls */
.back{position:absolute; width:70px; height:98px; box-sizing:border-box; background:var(--back); border:var(--back-border); border-radius:var(--back-r); box-shadow:0 6px 12px rgba(0,0,0,.35);}
.ehand{position:absolute; top:-50px; left:410px;}
.ehand .back{transform-origin:50% -40%;}
.deck{position:absolute; right:26px; width:76px; height:104px;}
.deck .back{width:70px; height:98px;}
.deck.e{top:196px;} .deck.p{top:420px;}
.deck .count{position:absolute; left:50%; bottom:-14px; translate:-50% 0; padding:3px 9px; font-size:12px; white-space:nowrap; z-index:2;}
.mana{position:absolute; right:24px; display:flex; align-items:center; gap:10px;}
.mana.e{top:18px;} .mana.p{bottom:22px;}
.mana .num{padding:4px 10px; font-size:15px; font-variant-numeric:tabular-nums;}
.gems{display:flex; gap:4px;}
.gems i{width:20px; height:24px; background:var(--mana-off); border-radius:var(--gem-r); clip-path:var(--gem-clip);}
.gems i.on{background:var(--mana-on);}
.mana.e .gems i{width:14px; height:18px;}
.endturn{position:absolute; right:16px; top:337px; width:120px; height:50px; box-sizing:border-box; display:grid; place-items:center; cursor:pointer;
  background:var(--btn-bg); color:var(--btn-ink); border:var(--btn-border); border-radius:var(--btn-r); box-shadow:var(--btn-shadow);
  font:700 var(--btn-size)/1.1 var(--btn-font); text-align:center; -webkit-text-stroke:var(--btn-stroke); paint-order:stroke fill;}
.turn{position:absolute; left:14px; top:318px; width:98px; padding:10px 8px; text-align:center; display:grid; gap:4px;}
.turn b{font-size:18px; font-weight:700;}
.turn span{font:12px/1.2 var(--fb); opacity:.85;}
.timer{height:5px; background:rgba(127,127,127,.35); border-radius:3px; overflow:hidden;}
.timer i{display:block; height:100%; width:64%; background:var(--arrow);}

.arrow{position:absolute; left:0; top:0; width:1280px; height:900px; pointer-events:none; z-index:20; overflow:visible;}
.arrow .edge{fill:none; stroke:var(--arrow-edge); stroke-width:17; stroke-linecap:round;}
.arrow .line{fill:none; stroke:var(--arrow); stroke-width:10; stroke-linecap:round; stroke-dasharray:var(--arrow-dash); animation:flow 1.2s linear infinite;}
.arrow .head{fill:var(--arrow); stroke:var(--arrow-edge); stroke-width:3; stroke-linejoin:round;}
.arrow .ring{fill:none; stroke:var(--arrow); stroke-width:4; stroke-dasharray:14 10; transform-box:fill-box; transform-origin:center; animation:spin 6s linear infinite;}
@keyframes flow{to{stroke-dashoffset:-40;}}
@keyframes spin{to{transform:rotate(360deg);}}

.strip{border-radius:12px; padding:22px 16px 26px; background:var(--bg); display:flex; flex-wrap:wrap; justify-content:center; gap:20px 22px; overflow:hidden; position:relative;}
.strip::after{content:""; position:absolute; inset:0; pointer-events:none; background:var(--overlay);}
.lg{display:grid; justify-items:center; gap:8px;}
.lg .cap{padding:4px 10px; font-size:12px; white-space:nowrap;}

@media (prefers-reduced-motion: reduce){
  .scene,.card,.unit{transition:none;}
  .arrow .line,.arrow .ring,.unit.shield::after{animation:none;}
}

function art(icon){ return `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONS[icon]}</svg>`; }

function badge(S, n){
  const i = n - 1;
  switch (S.badge){
    case 'shield': case 'diamond': return `<span class="tier tier-${S.badge}">${ROMAN[i]}</span>`;
    case 'tag': return `<span class="tier tier-tag">T${n}</span>`;
    case 'pips': return `<span class="tier tier-pips">${'<i></i>'.repeat(n)}</span>`;
    case 'blob': return `<span class="tier tier-blob">${n}</span>`;
    case 'titlo': return `<span class="tier tier-titlo"><b>${SLAV[i]}</b></span>`;
    case 'gauge': return `<span class="tier tier-gauge" style="--p:${n/7}">${n}</span>`;
    case 'seal': return `<span class="tier tier-seal">${KANJI[i]}</span>`;
    case 'coin': return `<span class="tier tier-coin">${n}</span>`;
    case 'dots': return `<span class="tier tier-dots">${Array.from({length:7},(_,j)=>`<i class="${j<n?'on':''}"></i>`).join('')}</span>`;
  }
}

function unitHTML(S, o){
  const u = UNITS[o.k], t = S.tiers[u.tier-1], hp = o.hp ?? u.hp;
  const cls = ['unit', u.taunt&&'taunt', u.shield&&'shield', o.sel&&'sel', o.target&&'target'].filter(Boolean).join(' ');
  return `<div class="${cls}" style="--t:${t}" title="${u.name} · тир ${u.tier}">
    <div class="frame"></div><div class="art" data-icon="${o.k}" data-c="${t}">${art(o.k)}</div>
    ${badge(S,u.tier)}
    <span class="stat atk">${u.atk}</span><span class="stat hp${hp<u.hp?' dmg':''}">${hp}</span></div>`;
}

function cardHTML(S, k, i, n){
  const u = UNITS[k], t = S.tiers[u.tier-1], c = i - (n-1)/2;
  return `<div class="card${u.cost<=MANA?' playable':''}" style="--t:${t};--x:${c*100}px;--y:${c*c*6}px;--r:${c*5}deg;z-index:${i+1}">

    <div class="c-art"><div class="frame"></div><div class="art" data-icon="${k}" data-c="${t}">${art(k)}</div></div>

    <div class="txt">${u.text}</div>
    <span class="stat atk">${u.atk}</span><span class="stat hp">${u.hp}</span></div>`;
}

function offsetIn(el, root){
  let x = 0, y = 0;
  while (el && el !== root){ x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return {x, y};
}

function drawArrow(){
  const a = scene.querySelector('.unit.sel'), b = scene.querySelector('.unit.target');
  if (!a || !b) return;
  const pa = offsetIn(a, scene), pb = offsetIn(b, scene);
  const ax = pa.x + a.offsetWidth/2, ay = pa.y + 4;
  const bx = pb.x + b.offsetWidth/2, by = pb.y + b.offsetHeight/2;
  const cx = (ax + bx)/2 + 60, cy = Math.min(ay, by) + (ay - by) * .35;
  const ang = Math.atan2(by - cy, bx - cx);
  const ex = bx - Math.cos(ang)*48, ey = by - Math.sin(ang)*48;
  const d = `M${ax} ${ay} Q${cx} ${cy} ${ex} ${ey}`;
  scene.querySelector('.arrow .edge').setAttribute('d', d);
  scene.querySelector('.arrow .line').setAttribute('d', d);
  const hx = bx - Math.cos(ang)*30, hy = by - Math.sin(ang)*30, w = 20, L = 32;
  const px = -Math.sin(ang), py = Math.cos(ang);
  const bx0 = hx - Math.cos(ang)*L, by0 = hy - Math.sin(ang)*L;
  scene.querySelector('.arrow .head').setAttribute('points', `${hx},${hy} ${bx0+px*w},${by0+py*w} ${bx0-px*w},${by0-py*w}`);
  const ring = scene.querySelector('.arrow .ring');
  ring.setAttribute('cx', bx); ring.setAttribute('cy', by);
}

/* Pixel style: rasterise each portrait to a tiny canvas and snap it to a 3-colour palette. */
function hexRgb(h){ h = h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function mixHex(a, b, t){ const A=hexRgb(a), B=hexRgb(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function pixelate(root){
  root.querySelectorAll('.art[data-icon]').forEach(el=>{
    const N = 22, fill = mixHex(el.dataset.c, '#ffffff', .25), line = '#140c1c';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 72 72" width="${N}" height="${N}"><style>*{fill:${fill};stroke:${line};stroke-width:5;paint-order:stroke;stroke-linejoin:round}.k{fill:${line};stroke:none}</style>${ICONS[el.dataset.icon]}</svg>`;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = cv.height = N;
      const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, N, N);
      try {
        const id = ctx.getImageData(0, 0, N, N), p = id.data, F = hexRgb(fill), K = hexRgb(line);
        for (let i = 0; i < p.length; i += 4){
          if (p[i+3] < 110){ p[i+3] = 0; continue; }
          const dF = (p[i]-F[0])**2 + (p[i+1]-F[1])**2 + (p[i+2]-F[2])**2;
          const dK = (p[i]-K[0])**2 + (p[i+1]-K[1])**2 + (p[i+2]-K[2])**2;
          const C = dF < dK ? F : K; p[i]=C[0]; p[i+1]=C[1]; p[i+2]=C[2]; p[i+3]=255;
        }
        ctx.putImageData(id, 0, 0);
      } catch (e) {}
      if (el.isConnected) el.replaceChildren(cv);
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

function stripHTML(S){

function renderPicks(){
  const list = STYLES.filter(s=>favs.includes(s.id));
  $('#picks').innerHTML = `
    <h3>Шорт-лист</h3>
    ${list.length ? `<ul>${list.map(s=>`<li><button type="button" data-go="${s.id}">${s.name}</button> · ${s.sub}</li>`).join('')}</ul>`
                  : `<p>Пока пусто. Отметьте стили звёздочкой, чтобы сравнить их между собой.</p>`}
    <p>Когда выберете, напишите название стиля в чат. Можно смешать: например, рамки из «Таверны» и тиры из «Былины».</p>
    <p class="keys"><kbd>1</kbd>–<kbd>0</kbd> или <kbd>←</kbd> <kbd>→</kbd> переключают стили</p>`;
  $('#picks').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(STYLES.findIndex(s=>s.id===b.dataset.go)));

function renderTabs(){
  $('#tabs').innerHTML = STYLES.map((s,i)=>`
    <button class="tab" role="tab" id="tab-${s.id}" aria-selected="${i===current}" data-i="${i}" type="button">
      <span class="key">${(i+1)%10}</span>
      <span class="nm" style="font-family:${s.font.replace(/"/g,"'")};font-size:${s.tabSize||16}px">${s.name}${favs.includes(s.id)?'<span class="fav" aria-label="в шорт-листе">★</span>':''}</span>
      <span class="sub">${s.sub}</span>
      <span class="sw" aria-hidden="true">${s.swatches.slice(0,3).map(c=>`<i style="background:${c}"></i>`).join('')}</span>
    </button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>select(+b.dataset.i));
}

function toggleFav(id){
  favs = favs.includes(id) ? favs.filter(f=>f!==id) : [...favs, id];
  try { localStorage.setItem('cardStyleFavs', JSON.stringify(favs)); } catch (e) {}
  renderTabs(); renderAbout(STYLES[current]); renderPicks();
}

function paint(){
  const S = STYLES[current];
  scene.dataset.style = S.id; strip.dataset.style = S.id;
  scene.innerHTML = sceneHTML(S);
  strip.innerHTML = stripHTML(S);
  if (S.id === 'pixel'){ pixelate(scene); pixelate(strip); }
  drawArrow();
}

function select(i, instant){
  current = (i + STYLES.length) % STYLES.length;
  const S = STYLES[current];
  renderTabs(); renderAbout(S); renderPicks();
  try { history.replaceState(null, '', '#' + S.id); } catch (e) {}
  try { localStorage.setItem('cardStyleLast', S.id); } catch (e) {}
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches){ paint(); return; }
  scene.classList.add('swap');
  setTimeout(()=>{ paint(); scene.classList.remove('swap'); }, 170);
}

function fit(){
  const s = stage.clientWidth / 1280;
  scene.style.transform = `scale(${s})`;
}
new ResizeObserver(fit).observe(stage);

document.addEventListener('keydown', e=>{
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (/^[0-9]$/.test(e.key)){ select(e.key === '0' ? 9 : +e.key - 1); }
  else if (e.key === 'ArrowRight'){ select(current + 1); }
  else if (e.key === 'ArrowLeft'){ select(current - 1); }
});

(function start(){
  let id = location.hash.slice(1);
  if (!STYLES.some(s=>s.id===id)){ try { id = localStorage.getItem('cardStyleLast') || ''; } catch (e) { id = ''; } }
  const i = STYLES.findIndex(s=>s.id===id);
  select(i < 0 ? 0 : i, true);
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawArrow);
})();
</script>
